<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行スケジュールビューア</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ボトムシートのアニメーション用 */
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        .slide-down { animation: slideDown 0.3s ease-in forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="bg-gray-200 flex justify-center min-h-screen">

    <!-- スマホサイズのコンテナ -->
    <div class="w-full max-w-md bg-white shadow-xl min-h-screen flex flex-col relative overflow-hidden">
        
        <!-- ヘッダー -->
        <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex justify-between items-center sticky top-0 gap-2">
            <!-- 旅行切り替えボタン -->
            <button id="trip-selector-trigger" class="flex items-center gap-1 text-lg font-bold hover:bg-blue-700 px-2 py-1 -ml-2 rounded transition">
                <span id="current-trip-name" class="truncate max-w-[160px]">旅行名</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <div class="flex items-center gap-2 flex-shrink-0">
                <button id="refresh-btn" class="hidden p-2 rounded bg-blue-700 hover:bg-blue-800 transition" title="スプレッドシートから更新" aria-label="スプレッドシートから更新">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
                <button id="edit-btn" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                    </svg>
                    <span id="edit-btn-label">データ入力</span>
                </button>
            </div>
        </header>

        <!-- 入力エリア（モーダル） -->
        <div id="input-area" class="bg-white absolute inset-0 z-30 h-full overflow-y-auto pb-20 p-4 hidden flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-800">データ入力</h2>
                <button id="close-input-btn" class="text-gray-500 hover:bg-gray-200 px-3 py-1 rounded text-sm font-bold">✕ 閉じる</button>
            </div>
            
            <p class="text-sm text-gray-600 mb-1 font-bold">旅行名</p>
            <input type="text" id="trip-name-input" class="w-full p-2 mb-6 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold" placeholder="例：秋の京都旅行">

            <p class="text-sm text-gray-600 mb-1 font-bold">行程（タイムスケジュール）</p>
            <p class="text-xs text-gray-500 mb-2">「行程」シートのセルをコピーして貼り付け</p>
            <textarea id="tsv-input" class="w-full h-32 p-2 mb-6 border border-gray-300 rounded text-xs no-scrollbar focus:outline-none focus:ring-2 focus:ring-blue-500 whitespace-pre" placeholder=""></textarea>

            <p class="text-sm text-gray-600 mb-1 font-bold">スポット一覧</p>
            <p class="text-xs text-gray-500 mb-2">「スポット」シートのセルをコピーして貼り付け</p>
            <textarea id="spot-input" class="w-full h-32 p-2 border border-gray-300 rounded text-xs no-scrollbar focus:outline-none focus:ring-2 focus:ring-blue-500 whitespace-pre" placeholder=""></textarea>

            <button id="save-btn" class="mt-6 w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded shadow transition flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                保存して更新する
            </button>
        </div>

        <!-- スケジュール表示エリア -->
        <main id="schedule-container" class="flex-1 overflow-y-auto bg-white pb-20 relative">
            <!-- JSで生成 -->
        </main>

        <!-- スポット表示エリア -->
        <main id="spot-container" class="flex-1 overflow-y-auto bg-gray-100 pb-20 p-4 space-y-3 hidden relative">
            <!-- JSで生成 -->
        </main>
        
        <!-- 下部ナビゲーション -->
        <nav class="bg-white border-t flex justify-around items-center fixed bottom-0 w-full max-w-md pb-safe z-10">
            <button id="tab-schedule" class="flex flex-col items-center flex-1 py-2 text-blue-600 border-t-2 border-blue-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-xs font-bold mt-1">行程</span>
            </button>
            <button id="tab-spots" class="flex flex-col items-center flex-1 py-2 text-gray-400 border-t-2 border-transparent transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span class="text-xs font-bold mt-1">スポット</span>
            </button>
        </nav>

        <!-- 旅行切り替えボトムシート（モーダル） -->
        <div id="trip-selector-modal" class="absolute inset-0 z-40 hidden flex-col justify-end">
            <div id="trip-selector-overlay" class="absolute inset-0 bg-black bg-opacity-40"></div>
            <div id="trip-selector-content" class="bg-white rounded-t-2xl z-10 w-full max-h-[80%] flex flex-col shadow-2xl relative translate-y-full">
                <div class="p-4 border-b flex justify-between items-center">
                    <h2 class="font-bold text-lg text-gray-800">旅行を切り替える</h2>
                    <button id="close-selector-btn" class="text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-full p-1.5 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <div class="overflow-y-auto p-4 flex-1">
                    <ul id="trip-list" class="space-y-3">
                        <!-- JSでリストを生成 -->
                    </ul>
                </div>
                <div class="p-4 border-t bg-gray-50">
                    <button id="add-trip-btn" class="w-full py-3 bg-white border-2 border-blue-500 text-blue-600 font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-blue-50 transition shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        Google スプレッドシートから追加
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // === アプリの状態管理 ===
        let trips = [];
        let currentTripId = null;
        let currentTab = 'schedule';
        let foldState = {}; // 折りたたみ状態の管理
        let currentSpotCategory = 'すべて'; // スポットの現在のフィルター

        // === ユーティリティ関数 ===
        function getIcon(type) {
            if (!type) return '';
            if (type.includes('ドライブ')) return '🚙';
            if (type.includes('出発') || type.includes('車')) return '🚗';
            if (type.includes('フライト') || type.includes('飛行機')) return '✈️';
            if (type.includes('鉄道') || type.includes('電車') || type.includes('新幹線')) return '🚃';
            if (type.includes('散策') || type.includes('徒歩') || type.includes('歩き')) return '🚶';
            if (type.includes('バス')) return '🚌';
            if (type.includes('宿泊') || type.includes('ホテル')) return '🏨';
            if (type.includes('温泉')) return '♨️';
            if (type.includes('歴史')) return '🏯';
            if (type.includes('街並み')) return '🏘️';
            if (type.includes('グルメ')) return '🍜';
            if (type.includes('食事') || type.includes('レストラン') || type.includes('カフェ')) return '🍽️';
            if (type.includes('観光')) return '📸';
            return '🔹';
        }

        function getSpotIcon(category) {
            if (!category) return '📍';
            if (category.includes('街並み') || category.includes('風景')) return '🏘️';
            if (category.includes('鉄道') || category.includes('駅')) return '🚃';
            if (category.includes('食') || category.includes('グルメ')) return '🍜';
            if (category.includes('城') || category.includes('歴史')) return '🏯';
            if (category.includes('自然') || category.includes('公園')) return '🌳';
            return '📍';
        }

        function generateId() {
            return 'trip_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // スプレッドシートから貼り付けた文字列を、HTMLではなく文字として表示する
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[char]);
        }

        // === Google Sheets 連携設定 ===
        // Google Cloud Console で作成した値を設定してください。秘密情報はここに書かないでください。
        const GOOGLE_CONFIG = {
            clientId: '537757065116-bp10juati2vdpulfhbg5snad2c78a79q.apps.googleusercontent.com',
            apiKey: 'AIzaSyAWmXSIdE2Nscqu3EDuSjPmyhsZehzCBlU',
            appId: '537757065116'
        };
        const GOOGLE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const GOOGLE_SHEET_MIME_TYPE = 'application/vnd.google-apps.spreadsheet';
        const remoteTripCache = new Map();
        const refreshingTripIds = new Set();
        let googleInitPromise = null;
        let googleTokenClient = null;
        let googleAccessToken = null;
        let googleTokenExpiresAt = 0;

        function isGoogleTrip(trip) {
            return trip && trip.source === 'google-sheet';
        }

        function isGoogleConfigReady() {
            return Object.values(GOOGLE_CONFIG).every(value => value && !value.startsWith('YOUR_'));
        }

        function loadExternalScript(id, src) {
            if (document.getElementById(id)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.id = id;
                script.src = src;
                script.async = true;
                script.onload = resolve;
                script.onerror = () => reject(new Error('Google のライブラリを読み込めませんでした。'));
                document.head.appendChild(script);
            });
        }

        async function ensureGoogleReady() {
            if (!isGoogleConfigReady()) {
                throw new Error('Google連携の設定が未完了です。GOOGLE_CONFIG に OAuth クライアントID、APIキー、プロジェクト番号を設定してください。');
            }
            if (googleInitPromise) return googleInitPromise;

            googleInitPromise = (async () => {
                await Promise.all([
                    loadExternalScript('google-api-loader', 'https://apis.google.com/js/api.js'),
                    loadExternalScript('google-identity-services', 'https://accounts.google.com/gsi/client')
                ]);
                await new Promise((resolve, reject) => {
                    window.gapi.load('picker', { callback: resolve, onerror: () => reject(new Error('Google Drive Picker を初期化できませんでした。')) });
                });
                googleTokenClient = window.google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CONFIG.clientId,
                    scope: GOOGLE_SCOPE,
                    callback: () => {}
                });
            })();

            try {
                await googleInitPromise;
            } catch (error) {
                googleInitPromise = null;
                throw error;
            }
        }

        async function getGoogleAccessToken(interactive = false) {
            await ensureGoogleReady();
            if (googleAccessToken && Date.now() < googleTokenExpiresAt - 60000) return googleAccessToken;

            return new Promise((resolve, reject) => {
                googleTokenClient.callback = response => {
                    if (response.error) {
                        reject(new Error('Googleへのログインまたは権限の許可が完了しませんでした。'));
                        return;
                    }
                    googleAccessToken = response.access_token;
                    googleTokenExpiresAt = Date.now() + (Number(response.expires_in || 3600) * 1000);
                    resolve(googleAccessToken);
                };
                googleTokenClient.requestAccessToken({ prompt: interactive ? 'select_account' : '' });
            });
        }

        async function pickSpreadsheet() {
            const accessToken = await getGoogleAccessToken(true);
            return new Promise((resolve, reject) => {
                const view = new window.google.picker.DocsView(window.google.picker.ViewId.SPREADSHEETS);
                view.setMode(window.google.picker.DocsViewMode.LIST);
                view.setIncludeFolders(false);
                view.setSelectFolderEnabled(false);

                const picker = new window.google.picker.PickerBuilder()
                    .setDeveloperKey(GOOGLE_CONFIG.apiKey)
                    .setAppId(GOOGLE_CONFIG.appId)
                    .setOAuthToken(accessToken)
                    .setSelectableMimeTypes(GOOGLE_SHEET_MIME_TYPE)
                    .addView(view)
                    .setTitle('旅行用スプレッドシートを選択')
                    .setCallback(data => {
                        if (data.action === window.google.picker.Action.PICKED) {
                            const doc = data[window.google.picker.Response.DOCUMENTS][0];
                            resolve({ id: doc.id, name: doc.name, url: doc.url });
                        } else if (data.action === window.google.picker.Action.CANCEL) {
                            reject(new Error('スプレッドシートの選択をキャンセルしました。'));
                        }
                    })
                    .build();
                picker.setVisible(true);
            });
        }

        function valuesToTsv(values) {
            return (values || []).map(row => row.map(cell => String(cell ?? '')).join('\t')).join('\n');
        }

        function validateSheetRows(scheduleRows, spotRows) {
            const scheduleHeaders = ['日付', '時間', '種別', '行動', '移動・備考'];
            // スポットは先頭3列だけをアプリ共通の項目として扱う。
            // 4列目以降は、旅行ごとに「備考」「アクセス」「営業時間」など自由に追加できる。
            const spotHeaders = ['カテゴリ', '採用状況', 'スポット名'];
            const matches = (actual, expected) => expected.every((header, index) => String(actual?.[index] || '').trim() === header);

            if (!matches(scheduleRows[0], scheduleHeaders)) {
                throw new Error('「行程」タブの1行目は「日付 / 時間 / 種別 / 行動 / 移動・備考」である必要があります。');
            }
            if (!matches(spotRows[0], spotHeaders)) {
                throw new Error('「スポット」タブの1行目は「カテゴリ / 採用状況 / スポット名」で始まる必要があります。4列目以降の見出しは自由に変更できます。');
            }
        }

        async function fetchTripDataFromSheet(trip) {
            const token = await getGoogleAccessToken(true);
            const params = new URLSearchParams();
            params.append('ranges', '行程!A:E');
            // スポットの4列目以降は任意項目のため、十分な列数まで取得する。
            params.append('ranges', 'スポット!A:ZZ');
            params.set('valueRenderOption', 'FORMATTED_VALUE');
            const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(trip.spreadsheetId)}/values:batchGet?${params.toString()}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json();
            if (!response.ok) {
                if (response.status === 401) {
                    googleAccessToken = null;
                    googleTokenExpiresAt = 0;
                }
                throw new Error(body?.error?.message || 'スプレッドシートを読み込めませんでした。');
            }

            const scheduleRows = body.valueRanges?.[0]?.values || [];
            const spotRows = body.valueRanges?.[1]?.values || [];
            validateSheetRows(scheduleRows, spotRows);
            return {
                scheduleData: valuesToTsv(scheduleRows),
                spotData: valuesToTsv(spotRows)
            };
        }

        async function refreshGoogleTrip(trip) {
            if (!isGoogleTrip(trip) || refreshingTripIds.has(trip.id)) return;
            refreshingTripIds.add(trip.id);
            updateHeaderControls();
            try {
                const data = await fetchTripDataFromSheet(trip);
                remoteTripCache.set(trip.id, data);
                trip.lastSyncedAt = new Date().toISOString();
                saveToStorage();
                if (trip.id === currentTripId) renderApp();
            } catch (error) {
                if (trip.id === currentTripId && !remoteTripCache.has(trip.id)) {
                    renderConnectionMessage(error.message, true);
                } else {
                    alert(error.message);
                }
            } finally {
                refreshingTripIds.delete(trip.id);
                updateHeaderControls();
            }
        }

        function getTripDisplayData(trip) {
            return isGoogleTrip(trip) ? remoteTripCache.get(trip.id) : trip;
        }

        function renderConnectionMessage(message, isError = false) {
            const scheduleContainer = document.getElementById('schedule-container');
            const spotContainer = document.getElementById('spot-container');
            const color = isError ? 'text-red-600' : 'text-gray-500';
            const html = `<div class="flex flex-col items-center justify-center min-h-[55vh] px-8 text-center ${color}"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg><p class="font-bold mb-2">${isError ? 'スプレッドシートを読み込めませんでした' : 'スプレッドシートを更新してください'}</p><p class="text-sm leading-relaxed">${escapeHTML(message)}</p></div>`;
            scheduleContainer.innerHTML = html;
            spotContainer.innerHTML = html;
        }

        // === データ管理 ===
        function loadData() {
            const savedTrips = localStorage.getItem('travelApp_trips');
            const savedCurrentId = localStorage.getItem('travelApp_currentTripId');
            const savedFoldState = localStorage.getItem('travelApp_foldState');

            if (savedTrips) {
                trips = JSON.parse(savedTrips).map(trip => ({ ...trip, source: trip.source || 'local' }));
                currentTripId = savedCurrentId;
            }

            if (savedFoldState) {
                foldState = JSON.parse(savedFoldState);
            }

            // 旧バージョンのデータ移行処理
            const oldSchedule = localStorage.getItem('savedScheduleData');
            const oldSpot = localStorage.getItem('savedSpotData');
            if (!savedTrips && (oldSchedule || oldSpot)) {
                const newTrip = {
                    id: generateId(),
                    name: '最初の旅行',
                    scheduleData: oldSchedule || '',
                    spotData: oldSpot || ''
                };
                trips.push(newTrip);
                currentTripId = newTrip.id;
                localStorage.removeItem('savedScheduleData');
                localStorage.removeItem('savedSpotData');
                saveToStorage();
            }

            // 現在のIDが存在しない場合（エラー回避）
            if (trips.length > 0 && !trips.find(t => t.id === currentTripId)) {
                currentTripId = trips[0].id;
            }
        }

        function saveToStorage() {
            localStorage.setItem('travelApp_trips', JSON.stringify(trips));
            localStorage.setItem('travelApp_currentTripId', currentTripId);
        }

        function saveFoldState() {
            localStorage.setItem('travelApp_foldState', JSON.stringify(foldState));
        }

        function createDefaultTrip() {
            const trip = {
                id: generateId(),
                name: '新しい旅行',
                source: 'local',
                scheduleData: '',
                spotData: ''
            };
            trips.push(trip);
            currentTripId = trip.id;
            saveToStorage();
        }

        function getCurrentTrip() {
            return trips.find(t => t.id === currentTripId);
        }

        function updateHeaderControls() {
            const trip = getCurrentTrip();
            const refreshButton = document.getElementById('refresh-btn');
            const editButton = document.getElementById('edit-btn');
            const editLabel = document.getElementById('edit-btn-label');

            if (!trip) {
                document.getElementById('current-trip-name').textContent = '旅行を追加';
                refreshButton.classList.add('hidden');
                editButton.classList.add('hidden');
                return;
            }

            document.getElementById('current-trip-name').textContent = trip.name;
            editButton.classList.remove('hidden');
            if (isGoogleTrip(trip)) {
                editLabel.textContent = 'Sheetを開く';
                refreshButton.classList.remove('hidden');
                refreshButton.disabled = refreshingTripIds.has(trip.id);
                refreshButton.classList.toggle('opacity-60', refreshingTripIds.has(trip.id));
                refreshButton.title = trip.lastSyncedAt
                    ? `最終取得: ${new Date(trip.lastSyncedAt).toLocaleString('ja-JP')}`
                    : 'スプレッドシートから更新';
            } else {
                editLabel.textContent = 'データ入力';
                refreshButton.classList.add('hidden');
            }
        }

        // === レンダリング処理 ===
        function renderApp() {
            const trip = getCurrentTrip();
            updateHeaderControls();
            if (!trip) {
                renderConnectionMessage('旅行切替メニューから「Google スプレッドシートから追加」を選んでください。');
                return;
            }

            const data = getTripDisplayData(trip);
            if (!data) {
                renderConnectionMessage('右上の更新ボタンを押し、Googleアカウントでログインして読み込んでください。');
                return;
            }

            renderSchedule(data.scheduleData);
            renderSpots(data.spotData);
        }

        function renderSchedule(rawData) {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            if (!rawData || !rawData.trim()) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-20"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg><p>行程データがありません</p></div>';
                return;
            }

            const lines = rawData.split('\n');
            const schedule = {};
            let hasValidData = false;

            lines.forEach(line => {
                const cols = line.split('\t');
                if (cols.length < 3) return; 

                const date = cols[0] ? cols[0].trim() : '';
                const time = cols[1] ? cols[1].trim() : '';
                const type = cols[2] ? cols[2].trim() : '';
                const action = cols[3] ? cols[3].trim() : '';
                const note = cols[4] ? cols[4].trim() : '';

                if (date === '日付' || !time || !action) return;
                
                hasValidData = true;
                if (!schedule[date]) schedule[date] = [];
                schedule[date].push({ time, type, action, note });
            });

            if (!hasValidData) {
                container.innerHTML = '<p class="p-4 text-gray-500 text-center">有効なデータが見つかりません。形式を確認してください。</p>';
                return;
            }

            for (const [date, items] of Object.entries(schedule)) {
                const foldKey = `${currentTripId}:${date}`;
                const isFolded = foldState[foldKey] === true;
                const dateHeader = document.createElement('div');
                
                dateHeader.className = 'bg-gray-100 px-4 py-3.5 text-gray-800 font-bold border-b border-t text-xl sticky top-0 z-0 shadow-sm flex justify-between items-center cursor-pointer transition-colors hover:bg-gray-200';
                
                // 開閉状態のアイコン表示
                const toggleIcon = isFolded 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>';

                dateHeader.innerHTML = `
                    <span>${escapeHTML(date)}</span>
                    <span class="text-sm font-normal text-gray-500 flex items-center gap-1">
                        ${isFolded ? '開く' : '閉じる'} ${toggleIcon}
                    </span>
                `;

                // 日付ヘッダーのクリックイベント（折りたたみトグル）
                dateHeader.addEventListener('click', () => {
                    foldState[foldKey] = !isFolded;
                    saveFoldState();
                    const data = getTripDisplayData(getCurrentTrip());
                    renderSchedule(data?.scheduleData || '');
                });

                container.appendChild(dateHeader);

                // 折りたたまれていない場合のみアイテムを描画
                if (!isFolded) {
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'border-b border-gray-200 p-4 hover:bg-gray-50 transition bg-white';
                        const icon = getIcon(item.type);
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <div class="text-base text-gray-900 leading-tight pr-2">
                                    <span class="font-bold mr-1 text-blue-900">${escapeHTML(item.time)}</span> ${escapeHTML(item.action)}
                                </div>
                                <div class="text-xs text-gray-600 flex items-center ml-auto whitespace-nowrap bg-gray-100 px-2 py-1 rounded-md font-medium border border-gray-200" aria-label="${escapeHTML(item.type)}" title="${escapeHTML(item.type)}">
                                    <span class="text-sm">${icon}</span>
                                </div>
                            </div>
                            ${item.note ? `<div class="text-sm text-gray-600 mt-2 pl-[3.25rem]">${escapeHTML(item.note)}</div>` : ''}
                        `;
                        container.appendChild(card);
                    });
                }
            }
        }

        function renderSpots(rawData) {
            const container = document.getElementById('spot-container');
            container.innerHTML = '';

            if (!rawData || !rawData.trim()) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-20"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /></svg><p>スポットデータがありません</p></div>';
                return;
            }

            const lines = rawData.split('\n');
            const headers = (lines.shift() || '').split('\t').map(header => header.trim());
            let hasValidData = false;
            const spots = [];
            const categories = new Set(); // カテゴリ抽出用

            lines.forEach(line => {
                const cols = line.split('\t');
                if (cols.length < 3) return;

                const category = cols[0] ? cols[0].trim() : '';
                const status = cols[1] ? cols[1].trim() : '';
                const name = cols[2] ? cols[2].trim() : '';

                if (!name) return;
                hasValidData = true;

                // 4列目以降はヘッダー名と値の組として、列数にかかわらずカードへ表示する。
                const details = cols.slice(3).map((value, index) => ({
                    label: headers[index + 3] || `項目${index + 4}`,
                    value: String(value || '').trim()
                })).filter(detail => detail.label && detail.value);
                
                spots.push({ category, status, name, details });
                if (category) categories.add(category);
            });

            if (!hasValidData) {
                container.innerHTML = '<p class="text-gray-500 text-center mt-8 text-sm">有効なスポットデータが見つかりません。</p>';
                return;
            }

            // カテゴリ内に現在のフィルターが存在しなければ「すべて」に戻す
            if (currentSpotCategory !== 'すべて' && !categories.has(currentSpotCategory)) {
                currentSpotCategory = 'すべて';
            }

            // カテゴリフィルター（タブ）の生成
            if (categories.size > 0) {
                const filterWrapper = document.createElement('div');
                // 画面上部に固定され、スクロールに追従。paddingで余白を調整
                filterWrapper.className = 'sticky top-0 z-10 bg-gray-100 -mx-4 px-4 py-3 -mt-4 mb-1 flex gap-2 overflow-x-auto no-scrollbar shadow-sm';
                
                // 「すべて」ボタン
                const allBtn = document.createElement('button');
                allBtn.className = `px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-colors border ${currentSpotCategory === 'すべて' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`;
                allBtn.textContent = 'すべて';
                allBtn.onclick = () => { currentSpotCategory = 'すべて'; renderSpots(rawData); };
                filterWrapper.appendChild(allBtn);

                // 各カテゴリのボタン
                Array.from(categories).forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = `px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-colors border flex items-center gap-1 ${currentSpotCategory === cat ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`;
                    btn.innerHTML = `<span class="text-base">${getSpotIcon(cat)}</span><span>${escapeHTML(cat)}</span>`;
                    btn.onclick = () => { currentSpotCategory = cat; renderSpots(rawData); };
                    filterWrapper.appendChild(btn);
                });

                container.appendChild(filterWrapper);
            }

            // スポットカードの生成
            spots.forEach(spot => {
                // フィルターに合致しないものはスキップ
                if (currentSpotCategory !== 'すべて' && spot.category !== currentSpotCategory) return;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm p-4 border border-gray-200 relative overflow-hidden';
                const icon = getSpotIcon(spot.category);
                
                let statusBadge = '';
                if (spot.status) {
                    let statusClass = 'bg-gray-100 text-gray-600 border-gray-200';
                    if (spot.status.includes('採用')) statusClass = 'bg-green-50 text-green-700 border-green-200 font-bold';
                    else if (spot.status.includes('候補')) statusClass = 'bg-orange-50 text-orange-700 border-orange-200';
                    statusBadge = `<span class="text-[10px] px-2 py-0.5 rounded-full border ${statusClass}">${escapeHTML(spot.status)}</span>`;
                }

                // Google Map用のURLエンコードされたクエリ
                const mapQuery = encodeURIComponent(spot.name);

                // スポット名の部分をGoogleマップへのリンク（<a>タグ）に変更
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <a href="https://www.google.com/maps/search/?api=1&query=${mapQuery}" target="_blank" rel="noopener noreferrer" class="flex items-start gap-2 group hover:opacity-70 transition active:opacity-50">
                            <span class="text-xl mt-0.5">${icon}</span>
                            <h3 class="font-bold text-blue-600 text-base leading-tight underline decoration-blue-200 underline-offset-2 group-hover:text-blue-800">${escapeHTML(spot.name)}</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-3 items-center">
                        ${spot.category ? `<span class="text-[10px] px-2 py-0.5 rounded border bg-gray-50 text-gray-600 border-gray-200 font-medium">${escapeHTML(spot.category)}</span>` : ''}
                        ${statusBadge}
                    </div>
                    ${spot.details.map(detail => `
                    <div class="text-sm text-gray-700 bg-blue-50/50 p-3 rounded-lg mt-2 border border-blue-100 leading-relaxed">
                        <span class="block text-[10px] font-bold text-blue-600 mb-0.5">${escapeHTML(detail.label)}</span>
                        <span>${escapeHTML(detail.value)}</span>
                    </div>`).join('')}
                `;
                container.appendChild(card);
            });
        }

        function renderTripList() {
            const listContainer = document.getElementById('trip-list');
            listContainer.innerHTML = '';

            trips.forEach(trip => {
                const isActive = trip.id === currentTripId;
                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded-xl border-2 cursor-pointer transition ${isActive ? 'border-blue-500 bg-blue-50' : 'border-transparent bg-gray-50 hover:bg-gray-100'}`;
                
                li.innerHTML = `
                    <button type="button" data-action="select" class="flex items-center gap-3 overflow-hidden flex-1 text-left">
                        <div class="w-2 h-2 rounded-full ${isActive ? 'bg-blue-500' : 'bg-transparent'} flex-shrink-0"></div>
                        <span class="font-bold text-gray-800 truncate ${isActive ? 'text-blue-700' : ''}">${escapeHTML(trip.name)}</span>
                    </button>
                    <button type="button" data-action="delete" class="text-gray-400 hover:text-red-500 p-2 transition ml-2 flex-shrink-0" title="削除する">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                `;
                li.querySelector('[data-action="select"]').addEventListener('click', () => selectTrip(trip.id));
                li.querySelector('[data-action="delete"]').addEventListener('click', () => deleteTrip(trip.id));
                listContainer.appendChild(li);
            });
        }

        // === UIアクション ===
        function switchTab(tab) {
            currentTab = tab;
            const scheduleContainer = document.getElementById('schedule-container');
            const spotContainer = document.getElementById('spot-container');
            const tabSchedule = document.getElementById('tab-schedule');
            const tabSpots = document.getElementById('tab-spots');

            if (tab === 'schedule') {
                scheduleContainer.classList.remove('hidden');
                spotContainer.classList.add('hidden');
                tabSchedule.classList.replace('text-gray-400', 'text-blue-600');
                tabSchedule.classList.replace('border-transparent', 'border-blue-600');
                tabSpots.classList.replace('text-blue-600', 'text-gray-400');
                tabSpots.classList.replace('border-blue-600', 'border-transparent');
            } else {
                scheduleContainer.classList.add('hidden');
                spotContainer.classList.remove('hidden');
                tabSpots.classList.replace('text-gray-400', 'text-blue-600');
                tabSpots.classList.replace('border-transparent', 'border-blue-600');
                tabSchedule.classList.replace('text-blue-600', 'text-gray-400');
                tabSchedule.classList.replace('border-blue-600', 'border-transparent');
            }
        }

        function openEditor() {
            const trip = getCurrentTrip();
            if (!trip || isGoogleTrip(trip)) return;

            document.getElementById('trip-name-input').value = trip.name;
            document.getElementById('tsv-input').value = trip.scheduleData;
            document.getElementById('spot-input').value = trip.spotData;
            
            const inputArea = document.getElementById('input-area');
            inputArea.classList.remove('hidden', 'fade-out');
            inputArea.classList.add('flex', 'fade-in');
        }

        function closeEditor() {
            const inputArea = document.getElementById('input-area');
            inputArea.classList.remove('fade-in');
            inputArea.classList.add('fade-out');
            setTimeout(() => {
                inputArea.classList.add('hidden');
                inputArea.classList.remove('flex');
            }, 300);
        }

        function saveEditorData() {
            const trip = getCurrentTrip();
            if (!trip) return;

            const newName = document.getElementById('trip-name-input').value.trim();
            trip.name = newName || '名称未設定の旅行';
            trip.scheduleData = document.getElementById('tsv-input').value;
            trip.spotData = document.getElementById('spot-input').value;

            saveToStorage();
            renderApp();
            closeEditor();
        }

        function handlePrimaryAction() {
            const trip = getCurrentTrip();
            if (!trip) return;
            if (isGoogleTrip(trip)) {
                const sourceUrl = trip.sourceUrl || `https://docs.google.com/spreadsheets/d/${encodeURIComponent(trip.spreadsheetId)}/edit`;
                window.open(sourceUrl, '_blank', 'noopener,noreferrer');
                return;
            }
            openEditor();
        }

        async function refreshCurrentTrip() {
            const trip = getCurrentTrip();
            if (!isGoogleTrip(trip)) return;
            await refreshGoogleTrip(trip);
        }

        // === 旅行リストのアクション ===
        function toggleSelectorModal(show) {
            const modal = document.getElementById('trip-selector-modal');
            const overlay = document.getElementById('trip-selector-overlay');
            const content = document.getElementById('trip-selector-content');

            if (show) {
                renderTripList();
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                overlay.classList.remove('fade-out');
                overlay.classList.add('fade-in');
                content.classList.remove('slide-down');
                content.classList.add('slide-up');
            } else {
                overlay.classList.remove('fade-in');
                overlay.classList.add('fade-out');
                content.classList.remove('slide-up');
                content.classList.add('slide-down');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }

        function selectTrip(id) {
            currentTripId = id;
            saveToStorage();
            renderApp();
            toggleSelectorModal(false);
        }

        async function addNewTrip() {
            try {
                const sheet = await pickSpreadsheet();
                const existingTrip = trips.find(trip => isGoogleTrip(trip) && trip.spreadsheetId === sheet.id);
                if (existingTrip) {
                    currentTripId = existingTrip.id;
                    saveToStorage();
                    toggleSelectorModal(false);
                    renderApp();
                    await refreshGoogleTrip(existingTrip);
                    return;
                }

                const trip = {
                    id: generateId(),
                    name: sheet.name || '名称未設定の旅行',
                    source: 'google-sheet',
                    spreadsheetId: sheet.id,
                    sourceUrl: sheet.url || `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheet.id)}/edit`,
                    addedAt: new Date().toISOString(),
                    lastSyncedAt: null
                };
                trips.push(trip);
                currentTripId = trip.id;
                saveToStorage();
                toggleSelectorModal(false);
                renderApp();
                await refreshGoogleTrip(trip);
            } catch (error) {
                if (error.message !== 'スプレッドシートの選択をキャンセルしました。') {
                    alert(error.message);
                }
            }
        }

        function deleteTrip(id) {
            if (!confirm('この端末の旅行一覧から削除してもよろしいですか？ Google スプレッドシート本体は削除されません。')) {
                return;
            }

            trips = trips.filter(t => t.id !== id);
            remoteTripCache.delete(id);
            
            // 削除したのが現在選択中の旅行だった場合、別のものを選択
            if (currentTripId === id) {
                currentTripId = trips[0]?.id || null;
                renderApp();
            }
            
            saveToStorage();
            renderTripList(); // リストを再描画
        }

        // === 初期化とイベントバインド ===
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderApp();

            // イベントリスナー
            document.getElementById('edit-btn').addEventListener('click', handlePrimaryAction);
            document.getElementById('refresh-btn').addEventListener('click', refreshCurrentTrip);
            document.getElementById('close-input-btn').addEventListener('click', closeEditor);
            document.getElementById('save-btn').addEventListener('click', saveEditorData);
            
            document.getElementById('tab-schedule').addEventListener('click', () => switchTab('schedule'));
            document.getElementById('tab-spots').addEventListener('click', () => switchTab('spots'));

            document.getElementById('trip-selector-trigger').addEventListener('click', () => toggleSelectorModal(true));
            document.getElementById('close-selector-btn').addEventListener('click', () => toggleSelectorModal(false));
            document.getElementById('trip-selector-overlay').addEventListener('click', () => toggleSelectorModal(false));
            document.getElementById('add-trip-btn').addEventListener('click', addNewTrip);
        });

    </script>
</body>
</html>
